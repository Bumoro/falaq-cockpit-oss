<html lang="en">

<title>Falaq Mobile</title>
<style>

.meter{height:6px;background:var(--gray-bg);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.section-head{display:flex;align-items:baseline;gap:8px;margin:28px 2px 12px}.section-head h2{font-size:20px;letter-spacing:-.025em;margin:0}.count{color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}.cards{display:grid;gap:10px}.provider-group{grid-column:1/-1;display:flex;align-items:center;gap:9px;margin:8px 1px -2px;color:var(--ink-2);font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.07em}.provider-group:after{content:"";height:1px;background:var(--line-2);flex:1}.card{display:flex;flex-direction:column;gap:11px;min-width:0;padding:15px;background:var(--surface);border:1px solid var(--line-2);border-left:4px solid var(--card-accent,transparent);border-radius:var(--radius);box-shadow:var(--shadow);color:inherit;text-decoration:none}.card.needs{border-color:color-mix(in srgb,var(--amber) 44%,var(--line-2));border-left-color:var(--card-accent,transparent)}.card.stale{border-color:color-mix(in srgb,var(--amber) 45%,var(--line-2));border-left-color:var(--card-accent,transparent)}.card.idle{filter:grayscale(.55);opacity:.58}.card.ended,.card.dead{opacity:.64}.card .top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.client{min-width:0;flex:1 1 150px;font-size:16px;font-weight:650;letter-spacing:-.02em;overflow-wrap:anywhere}.badge,.state{display:inline-flex;align-items:center;min-height:24px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}.badge{color:var(--ink-2);background:var(--gray-bg)}.badge.provider{color:var(--link);background:var(--blue-bg);text-transform:lowercase;letter-spacing:.02em}.state{gap:5px;color:var(--gray);background:var(--gray-bg)}.state:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.state.running{color:var(--green);background:var(--green-bg)}.state.needs_you{color:var(--amber);background:var(--amber-bg)}.state.ended,.state.dead{color:var(--link);background:var(--blue-bg)}.color-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink-2);white-space:nowrap}.color-tag i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tag-color);box-shadow:0 0 0 1px color-mix(in srgb,var(--tag-color) 75%,var(--line));flex:none}.row{color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.needs-msg{color:var(--ink);font-size:15px;line-height:1.45}.approve{display:grid;gap:8px}.approve .q{font-size:14px;font-weight:650;color:var(--ink)}.option-row{display:flex;align-items:center;gap:10px;min-height:48px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);font-weight:600;text-align:left}.option-row:before{content:"";width:17px;height:17px;flex:none;border:1.5px solid var(--ink-3);border-radius:50%;box-shadow:inset 0 0 0 4px var(--surface-2)}.option-row.recommended{border-color:color-mix(in srgb,var(--blue) 45%,var(--line));background:var(--blue-bg);color:var(--ink)}.option-row.recommended:before{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 4px var(--blue-bg)}.option-row .option-note{margin-left:auto;color:var(--link);font-size:11px;font-weight:650}.option-row:disabled{opacity:.58;cursor:not-allowed}.open-hint{color:var(--amber);font-size:13px}.card .agents{display:flex;flex-direction:column;gap:3px}.card .agrow{font-size:12px;color:var(--ink-3)}.card .agrow .run{color:var(--green)}.session-meta{display:flex;align-items:center;min-height:44px;margin-top:-5px}.open-chat{display:inline-flex;align-items:center;min-height:44px;margin-left:auto;padding:0 6px;color:var(--link);font-weight:600;text-decoration:none}.ctx{display:flex;flex-direction:column;gap:7px}.ctx .clab{display:flex;justify-content:space-between;gap:10px;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}.ctx .bar{height:6px;background:var(--gray-bg);border-radius:99px;overflow:hidden}.ctx .bar>i{display:block;height:100%;border-radius:9 .tasks{margin-top:28px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.tasks summary{min-height:54px;padding:0 15px;display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-size:16px;font-weight:650}.tasks summary::-webkit-details-marker{display:none}.tasks summary:after{content:"›";margin-left:auto;color:var(--ink-3);font-size:22px;transform:rotate(90deg);transition:transform .15s}.tasks[open] summary:after{transform:rotate(-90deg)}.task-list{padding:0 12px 12px;display:grid;gap:8px}.task{padding:12px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface-2)}.task.stale{opacity:.7}.task-title{font-weight:600;overflow-wrap:anywhere}.task-meta{margin-top:3px;color:var(--ink-3);font-size:12px}.task-actions{display:flex;gap:8px;margin-top:9px}.task-actions button{min-height:44px;flex:1;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--link);font-weight:600}.task-actions .abandon{color:var(--red)}
.card-actions{display:flex;align-items:center;gap:6px;min-height:44px;margin-top:-5px;flex-wrap:wrap}.card-action{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border:0;border-radius:10px;padding:0 9px;background:transparent;color:var(--link);font-size:13px;font-weight:650}.card-action.kill{color:var(--red)}.card-action:disabled{opacity:.55;cursor:wait}.wrap-notice{padding:8px 10px;border-radius:10px;background:var(--green-bg);color:var(--green);font-size:13px;font-weight:650}
.sheet-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.42);opacity:0;visibility:hidden;transition:opacity .18s ease,visibility .18s}.sheet-overlay.open{opacity:1;visibility:visible}.sheet{width:min(680px,100%);max-height:calc(100dvh - env(safe-area-inset-top) - 12px);overflow:auto;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));background:var(--surface);box-shadow:0 -18px 50px rgba(0,0,0,.22);transform:translateY(24px);transition:transform .18s ease}.sheet-overlay.open .sheet{transform:none}.sheet-grab{width:38px;height:5px;margin:0 auto 12px;border-radius:99px;background:var(--line)}.sheet h2{margin:0 0 14px;font-size:22px}.sheet label{display:block;margin:11px 0 5px;color:var(--ink-2);font-size:13px}.sheet .model-row{display:flex;gap:8px;align-items:stretch}.sheet .model-row select{flex:1;min-width:0}.sheet .model-refresh{flex:none;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:transparent;color:inherit;font:inherit;cursor:pointer}.sheet .model-refresh:disabled{opacity:.5}
.sheet input,.sheet textarea,.sheet select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);color:var(--ink);font:inherit}.sheet textarea{min-height:92px;resize:vertical}.sheet .check{display:flex;align-items:center;gap:8px;min-height:44px;margin:4px 0;color:var(--ink);font-size:15px}.sheet .check input{width:20px;min-height:20px;margin:0}.sheet-actions{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));display:flex;gap:8px;margin:17px -18px calc(-18px - env(safe-area-inset-bottom));padding:10px 18px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px)}.sheet-actions button{min-height:44px;flex:1;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:650}.sheet-actions .start{border-color:var(--blue);background:var(--blue);color:#fff}.sheet-actions button:disabled{opacity:.55;cursor:wait}body.sheet-open{overflow:hidden}
@media (min-width:560px){.duplicate-actions{grid-template-columns:1fr 1fr}.duplicate button.dismiss{grid-column:1/-1}.cards{grid-template-columns:1fr 1fr}.tasks{margin-bottom:20px}}

<body>
<div class="shell" id="mobileShell">
  <header><h1>Falaq <span class="sub">mobile</span></h1><span class="header-meta"><span class="clock" id="clock"></span><span class="stamp" id="stamp">Connecting…</span></span><button class="new-chat" data-action="open-new-chat">+ New chat</button><button class="refresh" id="refresh" data-action="refresh" aria-label="Refresh all data" title="Refresh">↻</button></header>
  <div class="offline" id="offline" role="status">Offline — showing the last successful update.</div>
  <div class="update" id="update" role="status"></div>
  <section class="needs-summary" id="needs" aria-live="polite"></section>
  <section class="duplicate" id="duplicate" aria-live="assertive"></section>
  <section class="strip" id="strip"><div class="tile"><div class="lab">Usage</div><div class="big">—</div><div class="sub">Loading…</div></div></section>
  <div class="section-head" id="needsHead" hidden><h2>Needs you</h2><span class="count" id="needsCount">0 sessions</span></div>
  <section class="cards" id="needsGrid"></section>
  <div class="section-head"><h2>Sessions</h2><span class="count" id="sessionCount">0 sessions</span></div>
  <main class="cards" id="sessions"><div class="empty">Loading sessions…</div></main>
  <details class="tasks" id="tasks"><summary>Active tasks <span class="count" id="taskCount">0</span></summary><div class="task-list" id="taskList"><div class="empty">Loading tasks…</div></div></details>
</div>
<div class="sheet-overlay" id="newChatSheet" aria-hidden="true">
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="newChatTitle">
    <div class="sheet-grab"></div>
    <h2 id="newChatTitle">New chat</h2>
    <label for="mProvider">Provider</label>
    <select id="mProvider"><option value="claude" selected>Claude</option><option value="codex">Codex</option><option value="ollama">Ollama</option><option value="agy">Antigravity</option></select>
    <label for="mModel">Model</label>
    <div class="model-row"><select id="mModel"></select><button type="button" class="model-refresh" data-action="refresh-models" title="Refresh the model list" aria-label="Refresh the model list">↻</button></div>
    <label for="mEffort">Effort</label>
    <select id="mEffort"></select>
    <label for="mTitle">Task title <span style="opacity:.7">(optional)</span></label>
    <input id="mTitle" placeholder="Inferred from your first prompt">
    <label for="mCwd">Project directory</label>
    <input id="mCwd" placeholder="~/your-project">
    <label for="mPrompt">First prompt</label>
    <textarea id="mPrompt" placeholder="What should this chat do first?"></textarea>
    <label class="check"><input type="checkbox" id="mUltra"> Ultracode (multi-agent)</label>
    <label class="check"><input type="checkbox" id="mSafe"> Safe mode (non-dev permissions)</label>
    <div class="sheet-actions"><button data-action="close-new-chat">Cancel</button><button class="start" id="startChat" data-action="create-chat">Start chat</button></div>
  </section>
</div>
<script>
const STALE_MS=10*60*1000, AMBER=.35, WARN=.5;
let TOKEN='', failCount=0, loading=false, duplicateCache=[], duplicateSessions=[], duplicateBusy=false, duplicateNotice=null, chatsCacheLast=[], activeOnly=false;
let updateState=null,updateApplying=false,updatePollTimer=null;
const wrapNotices=new Map();
const CARD_COLORS=[
  {name:'Teal',hex:'#168C89'}, {name:'Violet',hex:'#8567D3'},
  {name:'Gold',hex:'#9A7410'}, {name:'Rose',hex:'#BB4B77'},
  {name:'Sky',hex:'#287FA3'}, {name:'Lime',hex:'#6F8617'},
  {name:'Coral',hex:'#C05243'}, {name:'Indigo',hex:'#5968C5'},
];
function H(){return {'x-cockpit-token':TOKEN,'Content-Type':'application/json'};}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtTok(n){n=Number(n)||0;if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(0)+'k';return String(n);}
function ago(ts){const elapsed=Math.max(0,Date.now()-Number(ts||Date.now()));if(elapsed<60000)return Math.round(elapsed/1000)+'s ago';if(elapsed<=3600000)return Math.round(elapsed/60000)+'m ago';if(elapsed<=48*3600000)return Math.round(elapsed/3600000)+'h ago';if(elapsed<=14*86400000)return Math.round(elapsed/86400000)+'d ago';return Math.round(elapsed/(7*86400000))+'w ago';}
function cardColor(id){let hash=2166136261;for(const char of String(id||'')){hash^=char.codePointAt(0);hash=Math.imul(hash,16777619);}return CARD_COLORS[(hash>>>0)%CARD_COLORS.length];}
function colorTag(color){return `<span class="color-tag" style="--tag-color:${esc(color.hex)}"><i></i>${esc(color.name)}</span>`;}
function displayState(s){if(!s.state)return'idle';if(s.state==='running'&&Date.now()-s.lastActivityAt>STALE_MS&&!(s.liveAgents&&s.liveAgents.length))return'stale';return s.state;}
function stateClass(state){return ['running','needs_you','idle','stale','ended','dead'].includes(state)?state:'unknown';}
function stateLabel(state){return String(state||'unknown').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());}
function agentsOf(x){ return (x&&x.liveAgents&&x.liveAgents.length)?x.liveAgents:((x&&x.agents)||[]); }
function ctxClass(pct){ return pct>=WARN?'red':pct>=AMBER?'amber':''; }
function ctxHtml(c){ if(!c)return ''; if(!Number.isFinite(c.pct))return `<div class="ctx"><div class="clab"><span>Context used</span><span>n/a${Number.isFinite(c.limit)?` · ${esc(fmtTok(c.limit))} limit`:''}</span></div></div>`; const cls=ctxClass(c.pct); const pct=Math.round(c.pct*100); return `<div class="ctx ${cls}"><div class="clab"><span>Context used</span><span>${pct}% · ${esc(fmtTok(c.tokens))}/${esc(fmtTok(c.limit))}</span></div><div class="bar"><i style="width:${Math.min(100,pct)}%"></i></div></div>`; }
function stateLabelHtml(state){return esc(stateLabel(state));}
function resumeHtml(x){const actions=(x&&x.completedActions)||[], state=x&&x._d||x&&x.state;return `<b>While you were away</b><span>Now: ${stateLabelHtml(state)}</span>${actions.length?`<ul>${actions.map(a=>`<li>${esc(a.name)}${a.label?' · '+esc(a.label):''}</li>`).join('')}</ul>`:'<span> · no completed actions yet</span>'}`;}
function setOffline(on){document.getElementById('offline').classList.toggle('on',on);document.getElementById('sessions').classList.toggle('offline',on);document.getElementById('needsGrid').classList.toggle('offline',on);}
async function json(path,options){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),9000);try{const r=await fetch(path,{...(options||{}),signal:controller.signal});if(!r.ok)throw new Error(String(r.status));return await r.json();}finally{clearTimeout(timer);}}
function updateBehind(state){const value=state&&state.behind;if(typeof value==='number')return Math.max(0,Math.floor(value));return value===true?1:0;}
function renderUpdate(state){
  updateState=state||{};const count=updateBehind(updateState),updating=updateState.status==='started'||updateApplying,

    let projected=null,burn=null;
    if(cb.startTime&&cb.endTime){
      const start=Date.parse(cb.startTime),end=Date.parse(cb.endTime),now=Math.min(Date.now(),end);
      const elapsed=Math.max(1,(now-start)/60000),remaining=Math.max(0,(end-now)/60000);
      if(Number.isFinite(elapsed)&&Number.isFinite(remaining)){burn=cb.totalTokens/elapsed;projected=cb.totalTokens+burn*remaining;}
    }
    const cost=Number.isFinite(cb.costUSD)?'$'+cb.costUSD.toFixed(2)+' · ':'';
    codexSub=cost+(burn==null?resets:`${esc(fmtTok(Math.round(burn)))}/min · projects ${esc(fmtTok(Math.round(projected)))} · ${resets}`);
  }
  secondary.push(`<div class="tile"><span class="cap">codex</span><div class="lab">5-Hour Block</div><div class="big">${cb?esc(fmtTok(cb.totalTokens)):'—'}</div><div class="sub">${codexSub}</div><div class="meter"><i style="width:${Math.round(blockPct*100)}%;background:${blockPct>=.85?'var(--red)':'var(--blue)'}"></i></div></div>`);
  const wt=(usage&&usage.weekTile)||{mode:'volume'};
  const wCost=w?(w.totalCost||w.costUSD||0):0;
  let weekBig,weekSub,weekMeterPct=null,weekMeterColor='var(--blue)';
  if(wt.mode==='real'){
    const pct=wt.pct;
    const d=wt.asOf!=null?new Date(wt.asOf):null;
    const stamp=d?(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')):'—';
    weekBig=pct+'%';weekSub='weekly limit · as of '+stamp+(wt.stale?' · stale':'');weekMeterPct=Math.max(0,Math.min(100,pct));weekMeterColor=pct>=85?'var(--red)':(pct>=70?'var(--amber)':'var(--blue)');
  }else if(wt.mode==='est'){
    weekBig='~'+wt.pct+'%';weekSub='est · configured cap · $'+wCost.toFixed(2);weekMeterPct=Math.max(0,Math.min(100,wt.pct));weekMeterColor='var(--ink-3)';
  }else{
    weekBig=w?esc(fmtTok(w.totalTokens)):'—';weekSub=w?('$'+wCost.toFixed(2)+' · limit % unavailable — sync via Claude.app'):'—';
  }
  const projection=usage&&usage.weekProjection;
  if(projection&&projection.cap){weekBig=esc(fmtTok(projection.tokens))+' / '+esc(fmtTok(projection.cap));weekSub=projection.pct+'% · '+(projection.exhaustionDay==='limit reached'?'limit reached':projection.exhaustionDay?'at this pace: '+projection.exhaustionDay:'at this pace: within weekly limit');weekMeterPct=Math.max(0,Math.min(100,projection.pct));weekMeterColor=projection.pct>=85?'var(--red)':(projection.pct>=70?'var(--amber)':'var(--blue)');}
  const weekMeterHtml=weekMeterPct==null?'':`<div class="meter"><i style="width:${weekMeterPct}%;background:${weekMeterColor}"></i></div>`;
  const weekFramingHtml=usage&&usage.framing?`<div class="sub">${esc(usage.framing)}</div>`:'';
  tiles.push(`<div class="tile"><span class="cap">claude</span><div class="lab">This Week</div><div class="big">${weekBig}</div><div class="sub">${weekSub}</div>${weekMeterHtml}${weekFramingHtml}</div>`);
  const cw=usage&&usage.codexWeek;
  tiles.push(`<div class="tile"><span class="cap">codex</span><div class="lab">This Week</div><div class="big">${cw?esc(fmtTok(cw.totalTokens)):'—'}</div><div class="sub">${cw?'$'+(cw.totalCost||cw.costUSD||0).toFixed(2):'no Codex activity'}</div></div>`);
  const ollamaWeek=usage&&usage.ollamaWeek;
  if(ollamaWeek)tiles.push(`<div class="tile"><span class="cap">ollama</span><div class="lab">This Week</div><div class="big">${esc(fmtTok(ollamaWeek.totalTokens))}</div><div class="sub">tokens</div></div>`);
  const ollamaBlock=usage&&usage.ollamaBlock;
  if(ollamaBlock)secondary.push(`<div class="tile"><span class="cap">ollama</span><div class="lab">5-Hour Block</div><div class="big">${esc(fmtTok(ollamaBlock.totalTokens))}</div><div class="sub">tokens · ${resets}</div></div>`);
  tiles.push(...secondary);
  tiles.push(`<button class="tile count${activeOnly?' active':''}" data-action="toggle-active-filter" aria-pressed="${activeOnly}"><div class="lab">Running</div><div class="big">${running}</div><div class="sub">${activeOnly?'showing active only':controlled+' controlled'}</div></button>`);
  tiles.push(`<div class="tile count ${needs?'alarm':''}"><div class="lab">Needs You</div><div class="big">${needs}</div><div class="sub">${needs?'action required':'all clear'}</div></div>`);
  tiles.push(`<div class="tile count ${overCtx?'alarm':''}"><div class="lab">Over 50% ctx</div><div class="big">${overCtx}</div><div class="sub">${overCtx?'wrap &amp; save':'headroom ok'}</div></div>`);
  document.getElementById('strip').innerHTML=tiles.join('');
}
function taskHtml(task){return `<div class="task ${task.displayState==='stale'?'stale':''}"><div class="task-title">${esc(task.task||'Untitled task')}</div><div class="task-meta">${esc(task.agent||'session task')} · ${esc(task.relativeTime||'')} · ${esc(task.displayState||'live')}</div><div class="task-actions"><button data-action="task-update" data-task-key="${esc(task.key)}" data-status="completed">Done</button><button class="abandon" data-action="task-update" data-task-key="${esc(task.key)}" data-status="abandoned">Abandon</button></div></div>`;}
function renderTasks(tasks){const active=(Array.isArray(tasks)?tasks:[]).filter(t=>['live','stale'].includes(t.displayState));document.getElementById('taskCount').textContent=String(active.length);document.getElementById('taskList').innerHTML=active.length?active.map(taskHtml).join(''):'<div class="empty">No active tasks.</div>';}
async function updateTask(el){const key=el.dataset.taskKey,status=el.dataset.status;if(!key||!['completed','abandoned'].includes(status)||!confirm(`${status==='completed'?'Mark this task done':'Abandon this task'}?`))return;el.disabled=true;try{const r=await fetch('/api/tasks/actions',{method:'POST',headers:H(),body:JSON.stringify({taskKeys:[key],status})});if(!r.ok)throw new Error();tick();}catch(e){alert('Could not update the task. Check the connection and try again.');}finally{el.disabled=false;}}

async function tick(force=false){if(loading||(!force&&document.hidden))return;loading=true;const refresh=document.getElementById('refresh');refresh.disabled=true;refresh.classList.add('spinning');try{if(!TOKEN){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),9000);try{const r=await fetch('/api/token',{signal:controller.signal});if(!r.ok)throw new Error(String(r.status));TOKEN=await r.text();}finally{clearTimeout(timer);}}
  // Sessions are the page's backbone — a failure there is a real outage. Secondary feeds fall
  // back per-endpoint (like live.html) so one flaky API degrades a section, not the whole page.
  const sessions=await json('/api/sessions');
  const [chats,usage,eventData,duplicates,update]=await Promise.all([
    json('/api/chats',{headers:H()}).catch(e=>{if(String(e.message)==='403')TOKEN='';return chatsCacheLast;}),
    json('/api/usage').catch(()=>null),
    json('/api/events').catch(()=>null),
    json('/api/duplicates').catch(()=>({pairs:duplicateCache})),
    json('/api/update',{headers:H(),cache:'no-store'}).catch(()=>null),
  ]);
  chatsCacheLast=chats||[];failCount=0;setOffline(false);renderNeeds(sessions,eventData&&eventData.tasks);renderDuplicates(duplicates,sessions);if(usage)renderStrip(sessions,chats||[],usage);if(update)renderUpdate(update);renderSessions(sessions,chats||[]);if(eventData)renderTasks(eventData.tasks);document.getElementById('stamp').textContent='Updated just now';}catch(e){failCount++;if(failCount>=2)setOffline(true);document.getElementById('stamp').textContent='Reconnecting…';}finally{loading=false;refresh.disabled=false;refresh.classList.remove('spinning');}}
// The answered-set survives re-renders: the 3s poll (and the 1.2s-cached /api/sessions prompt)
// can rebuild the card with the SAME pending question after an answer was sent — those buttons
// must render disabled or a second tap fires another non-idempotent tmux key.
const answeredPending=new Map();
function pendingKey(name,pending){return name+'\0'+String(pending&&pending.title||'')+'\0'+((pending&&pending.options)||[]).map(o=>o.key).join(',');}
function isAnswered(name,pending){const at=answeredPending.get(pendingKey(name,pending));return typeof at==='number'&&Date.now()-at<120000;}
async function answerCard(el){const name=el.dataset.chat,key=el.dataset.key,pkey=el.dataset.pkey;if(!name||!key||el.disabled)return;const buttons=el.closest('.approve').querySelectorAll('button');buttons.forEach(button=>button.disabled=true);const prior=el.textContent;el.textContent='Sending…';if(pkey)answeredPending.set(pkey,Date.now());try{const r=await fetch(`/api/chats/${encodeURIComponent(name)}/keys`,{method:'POST',headers:H(),body:JSON.stringify({key})});if(!r.ok)throw new Error(String(r.status));el.textContent='Sent ✓';setTimeout(()=>tick(true),450);}catch(e){if(pkey)answeredPending.delete(pkey);el.textContent=prior;buttons.forEach(button=>button.disabled=false);alert('Could not send the answer. Check the connection and try again.');}}
async function wrapChat(el){const name=el.dataset.chat;if(!name||el.disabled||!confirm('Send the wrap-up and stop instruction to this chat?'))return;el.disabled=true;try{const r=await fetch(`/api/chats/${encodeURIComponent(name)}/wrap`,{method:'POST',headers:H(),body:'{}'});if(!r.ok){const body=await r.json().catch(()=>({}));throw new Error(body.error||String(r.status));}wrapNotices.set(name,Date.now());await tick(true);setTimeout(()=>tick(true),8200);}catch(e){el.disabled=false;alert('Could not wrap up the chat: '+e.message);}}
async function killChat(el){const name=el.dataset.chat;if(!name||el.disabled||!confirm('Kill this chat session?'))return;el.disabled=true;try{const r=await fetch(`/api/chats/${encodeURIComponent(name)}`,{method:'DELETE',headers:H()});if(!r.ok){const body=await r.json().catch(()=>({}));throw new Error(body.error||String(r.status));}await tick(true);}catch(e){el.disabled=false;alert('Could not kill the chat: '+e.message);}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
document.addEventListener('click',e=>{if(e.target===document.getElementById('newChatSheet')){closeNewChat();return;}const el=e.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='dismiss-duplicate')dismissDuplicate();else if(el.dataset.action==='save-kill')saveKillDuplicate(el);else if(el.dataset.action==='task-update')updateTask(el);else if(el.dataset.action==='apply-update')applyUpdate();else if(el.dataset.action==='answer-card')answerCard(el);else if(el.dataset.action==='wrap-chat')wrapChat(el);else if(el.dataset.action==='kill-chat')killChat(el);else if(el.dataset.action==='open-new-chat')openNewChat();else if(el.dataset.action==='close-new-chat')closeNewChat();else if(el.dataset.action==='create-chat')createChat();else if(el.dataset.action==='refresh')tick(true);else if(el.dataset.action==='refresh-models')refreshModels(el);else if(el.dataset.action==='toggle-active-filter'){activeOnly=!activeOnly;for(const id of ['sessions','needsGrid'])document.getElementById(id).classList.toggle('active-only',activeOnly);el.classList.toggle('active',activeOnly);el.setAttribute('aria-pressed',String(activeOnly));}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('newChatSheet').classList.contains('open'))closeNewChat();});
function openNewChatFromHash(){if(location.hash==='#new-chat'&&!document.getElementById('newChatSheet').classList.contains('open'))openNewChat();}
window.addEventListener('hashchange',openNewChatFromHash);
openNewChatFromHash();
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
updateClock();setInterval(updateClock,30000);
fetch('/api/token').then(r=>{if(!r.ok)throw new Error();return r.text();}).then(t=>{TOKEN=t;}).catch(()=>{}).finally(tick);
setInterval(tick,3000);
</script>

@media (min-width:900px){.workspace{width:100%;max-width:none;margin:0;justify-content:stretch}.chat-sidebar{width:var(--sidebar-w,320px);flex:0 0 var(--sidebar-w,320px);min-height:0;background:var(--surface-2);border-right:1px solid var(--line-2);display:flex;flex-direction:column}.shell{width:auto;max-width:none;flex:1}.back{display:none}#messages:not(.picker)>*{width:min(100%,800px);margin-left:auto;margin-right:auto}#composer{width:min(calc(100% - 32px),800px);margin-left:auto;margin-right:auto}.picker{width:100%;max-width:1080px;margin:0 auto}.picker .intro,.picker .picker-cards{display:none}.picker .desktop-picker-empty{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--ink-3);text-align:center;padding:48px 20px}.sidebar-list .chat-card{grid-template-columns:minmax(0,1fr);gap:9px;margin:0 0 7px;padding:12px;border-radius:11px;box-shadow:none}.sidebar-list .chat-card:hover{box-shadow:none}.sidebar-list .chat-card>.open{justify-self:start;padding:5px 11px;font-size:12px}.sidebar-list .chat-copy{gap:7px}.sidebar-list .chat-name{flex-basis:100%;font-size:14px}.sidebar-list .needs-msg{font-size:13px}.sidebar-list .ctx{gap:5px}.sidebar-list .ctx .clab,.sidebar-list .activity{font-size:11px}.sidebar-list .option-row{min-height:40px;padding:7px 9px;font-size:13px}.sidebar-list .option-note,.sidebar-list .color-tag{display:none}}
@media (min-width:900px) and (max-width:1249px){#filesPanel{position:fixed;top:0;right:0;bottom:0;z-index:5;box-shadow:-24px 0 60px -30px rgba(0,0,0,.5)}}
@media (max-width:559px){.new-chat-desktop{display:none}.new-chat-mobile{display:inline-flex}}
@media (max-width:699px){.devwrap .dl{display:none}}
@media (max-width:899px){#filesPanel{position:fixed;inset:0;z-index:5;width:auto;border:0}.files-head{padding-top:calc(12px + env(safe-area-inset-top));height:calc(59px + env(safe-area-inset-top))}}
@media (max-width:480px){textarea{font-size:16px}.option-row,.open{min-height:44px}.pending .option-row{width:100%}.chat-card{align-items:start}.chat-card>.open{align-self:center}header{padding-left:12px;padding-right:12px}.pill{display:none}#messages{padding-left:12px;padding-right:12px}.turn-stack{max-width:92%}#composer{margin-left:10px;margin-right:10px}}

<body>
<div class="workspace"><aside id="chatSidebar" class="chat-sidebar" aria-label="All chats"><div class="sidebar-head"><h2>Chats</h2><button class="sidebar-new" type="button" data-new aria-label="Start a new chat" title="New chat">+</button></div><div id="sidebarList" class="sidebar-list"><div class="sidebar-empty">Loading chats…</div></div></aside><div class="resize-handle" id="sidebarResize" title="Drag to resize"></div><div class="shell">
  <div id="offline" class="offline">Reconnecting…</div>
  <header><div class="title"><a id="back" class="back" href="/chat" hidden>All chats</a><h1 id="heading">Chats</h1></div><div class="header-actions"><span class="devwrap"><span class="dl">Developer view</span><button class="switch" id="devToggle" role="switch" aria-checked="false" aria-label="Developer view"></button></span><button id="themeButton" class="theme-button" type="button" aria-label="Theme: System. Activate for Light." title="Theme: System"><span id="themeIcon" class="theme-icon" aria-hidden="true">◐</span><span id="themeMode">System</span></button><button id="filesButton" type="button" data-files-toggle hidden aria-expanded="false">Files · 0</button><span id="state"></span></div></header>
  <main id="messages"><div class="empty">Loading…</div></main>
  <div id="pendingDock" hidden></div>
  <form id="composer" hidden><button id="attachButton" class="attach-button" type="button" aria-label="Attach files" title="Attach files">+</button><input id="fileInput" type="file" multiple hidden><textarea id="input" maxlength="4000" rows="1" placeholder="Message Claude…" aria-label="Message Claude"></textarea><button id="sendButton" class="send" type="submit" aria-label="Send message" title="Send">↑</button><p id="uploadError" class="upload-error" role="status" hidden></p></form>
  <div id="ended" class="ended" hidden>This chat has ended.</div>
</div><div class="resize-handle" id="filesResize" title="Drag to resize"></div><aside id="filesPanel" aria-label="Chat files" hidden><div class="files-head"><h2>Files</h2><button id="filesClose" class="icon-button" type="button" data-files-close aria-label="Close files">×</button></div><div class="files-inner"><div id="filesList"></div><section id="filePreview" aria-label="File preview" hidden><div class="preview-head"><button id="previewBack" class="icon-button" type="button" data-preview-back aria-label="Back to files">‹</button><div id="previewTitle" class="preview-title"></div><button id="downloadFile" class="download-button" type="button" data-download>Download</button></div><div id="previewBody" class="preview-body"></div></section></div></aside></div>
<div id="newChatSheet" hidden><div class="nc-card" role="dialog" aria-modal="true" aria-label="Start a new chat"><h2>New chat</h2>
<label class="nc-field"><span>What should this chat help with?</span><textarea id="ncTask" maxlength="4000" placeholder="Describe the task…"></textarea></label>
<div class="nc-row"><label class="nc-field"><span>Assistant</span><select id="ncProvider"><option value="claude" selected>Claude</option><option value="codex">Codex</option><option value="ollama">Ollama</option><option value="agy">Antigravity</option></select></label>
<label class="nc-field"><span>Model</span><span class="nc-model-row"><select id="ncModel"></select><button type="button" class="nc-refresh" data-nc-refresh title="Refresh the model list" aria-label="Refresh the model list">↻</button></span></label>
<label class="nc-field"><span>Effort</span><select id="ncEffort"></select></label></div>
<label class="nc-check"><input type="checkbox" id="ncSafe" checked> Safe mode (limited permissions)</label>
<label class="nc-check"><input type="checkbox" id="ncUltra"> Ultracode (multi-agent)</label>
<div class="nc-actions"><button class="nc-cancel" type="button" data-nc-cancel>Cancel</button><button class="nc-start" type="button" data-nc-start>Start chat</button></div></div></div>
<script src="/md.js"></script>
<script>
const CK_NAME=/^ck-[a-z0-9-]{1,40}$/;
const THEME_MODES=['system','light','dark'];
const THEME_LABELS={system:'System',light:'Light',dark:'Dark'};
const THEME_ICONS={system:'◐',light:'☀',dark:'☾'};
function savedTheme(){try{const value=localStorage.getItem('ck-theme');return THEME_MODES.includes(value)?value:'system';}catch(e){return 'system';}}
function setTheme(mode){const theme=THEME_MODES.includes(mode)?mode:'system',button=document.getElementById('themeButton');if(theme==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=theme;document.getElementById('themeMode').textContent=THEME_LABELS[theme];document.getElementById('themeIcon').textContent=THEME_ICONS[theme];button.setAttribute('aria-label','Theme: '+THEME_LABELS[theme]+'. Activate for '+THEME_LABELS[THEME_MODES[(THEME_MODES.indexOf(theme)+1)%THEME_MODES.length]]+'.');button.title='Theme: '+THEME_LABELS[theme];try{localStorage.setItem('ck-theme',theme);}catch(e){}}
let themeMode=savedTheme();setTheme(themeMode);
function savedDeveloperView(){try{return localStorage.getItem('ck-devview')==='true';}catch(e){return false;}}
function setDeveloperView(enabled){const on=!!enabled,root=document.documentElement,button=document.getElementById('devToggle');root.classList.toggle('dev',on);button.setAttribute('aria-checked',String(on));}
let developerView=savedDeveloperView();setDeveloperView(developerView);
// Panel resizing: drag the handles beside the sidebar and files rail; widths persist per browser.
// The files handle grows the rail as you drag LEFT (the rail sits on the right edge).
(function(){
  const ws=document.querySelector('.workspace');
  const saved={sidebar:null,files:null};
  try{saved.sidebar=parseInt(localStorage.getItem('ck-sidebar-w'),10)||null;saved.files=parseInt(localStorage.getItem('ck-files-w'),10)||null;}catch(e){}
  const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
  // Boot restore must clamp: a width persisted on a wider window would otherwise shove the
  // conversation column off-screen (flex-shrink:0 rails, shell absorbs the overflow at 0px).
  // Cap each rail at 40% of the workspace so both together always leave the shell ≥20%.
  const bootMax=varLo=>Math.max(varLo,Math.round((ws.clientWidth||innerWidth)*0.4));
  if(saved.sidebar)ws.style.setProperty('--sidebar-w',clamp(saved.sidebar,120,Math.min(520,bootMax(120)))+'px');
  if(saved.files)ws.style.setProperty('--files-w',clamp(saved.files,120,Math.min(600,bootMax(120)))+'px');
  function wire(id,varName,storeKey,lo,hi,invert){
    // hi is re-derived from the live workspace width so "as wide as you like" scales with the window

    const handle=document.getElementById(id);if(!handle)return;
    handle.addEventListener('pointerdown',e=>{
      e.preventDefault();handle.setPointerCapture(e.pointerId);handle.classList.add('dragging');
      const startX=e.clientX;
      const startW=parseInt(getComputedStyle(ws).getPropertyValue(varName),10)||(varName==='--sidebar-w'?320:340);
      const move=ev=>{const d=(ev.clientX-startX)*(invert?-1:1);const w=clamp(startW+d,lo,Math.max(hi,Math.round(ws.clientWidth*0.55)));ws.style.setProperty(varName,w+'px');};
      const up=ev=>{handle.classList.remove('dragging');handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',up);
        const w=parseInt(getComputedStyle(ws).getPropertyValue(varName),10);if(w){try{localStorage.setItem(storeKey,String(w));}catch(err){}}};
      handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',up);
    });
  }
  wire('sidebarResize','--sidebar-w','ck-sidebar-w',120,520,false);
  wire('filesResize','--files-w','ck-files-w',120,600,true);
})();
document.getElementById('ncProvider').addEventListener('change',e=>ncSetProvider(e.target.value));
document.getElementById('ncModel').addEventListener('change',e=>setModelEfforts(document.getElementById('ncEffort'),document.getElementById('ncProvider').value,e.target.value));
// The sheet lives OUTSIDE .workspace, so its buttons need their own delegation — clicks here never
// bubble to the .workspace listener. Clicking the backdrop (outside the card) also closes.
document.getElementById('newChatSheet').addEventListener('click',e=>{
  if(e.target.closest('[data-nc-cancel]')){closeNewChat();return;}
  const refresh=e.target.closest('[data-nc-refresh]');if(refresh){e.preventDefault();refreshModels(refresh);return;}
  if(e.target.closest('[data-nc-start]')){startNewChat();return;}
  if(!e.target.closest('.nc-card'))closeNewChat();
});
document.getElementById('themeButton').addEventListener('click',()=>{themeMode=THEME_MODES[(THEME_MODES.indexOf(themeMode)+1)%THEME_MODES.length];setTheme(themeMode);});
document.getElementById('devToggle').addEventListener('click',()=>{const on=!document.documentElement.classList.contains('dev');try{localStorage.setItem('ck-devview',String(on));}catch(e){}if(on){location='/live';return;}developerView=false;setDeveloperView(false);});
// A chat name only ever flows into an /api/chats/<name>/… path. Validate the URL param up front so a
// malformed ?name= (slashes, a query/fragment, quotes) can NEVER be spliced into a fetch path or the
// DOM — an invalid value falls back to the picker instead. Every fetch still encodeURIComponent's it.
let TOKEN='', NAME=(new URLSearchParams(location.search).get('name')||'').trim(), lastJSON='', failCount=0, sending=false, uploading=false, mediatedAwaiting=false;
let activeTranscript='', chatFiles=[], lastFilesAt=0, lastFilesKey='', previewURL='', previewFile=null, lastPendingJSON='', lastSidebarHTML='', lastPickerHTML='';
const activityOpen=new Set();
// A sessions poll may keep returning the same pending prompt briefly after its key is sent. Keep the
// question identity answered across those re-renders so neither the picker nor sidebar can send it twice.
const answeredPending=new Map();
function pendingKey(name,pending){return name+'\0'+String(pending&&pending.title||'')+'\0'+((pending&&pending.options)||[]).map(o=>o.key).join(',');}
function isAnswered(name,pending){const at=answeredPending.get(pendingKey(name,pending));return typeof at==='number'&&Date.now()-at<120000;}
if(NAME && !CK_NAME.test(NAME)){ NAME=''; try{history.replaceState(null,'','/chat');}catch(e){} }
fetch('/api/token').then(r=>r.text()).then(t=>{TOKEN=t; tick();}).catch(()=>{});
function H(){return {'x-cockpit-token':TOKEN,'Content-Type':'application/json'};}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const CARD_COLORS=[
  {name:'Teal',hex:'#168C89'}, {name:'Violet',hex:'#8567D3'},
  {name:'Gold',hex:'#9A7410'}, {name:'Rose',hex:'#BB4B77'},
  {name:'Sky',hex:'#287FA3'}, {name:'Lime',hex:'#6F8617'},
  {name:'Coral',hex:'#C05243'}, {name:'Indigo',hex:'#5968C5'},
];
function cardColor(id){let hash=2166136261;for(const char of String(id||'')){hash^=char.codePointAt(0);hash=Math.imul(hash,16777619);}return CARD_COLORS[(hash>>>0)%CARD_COLORS.length];}
function colorTag(color){return `<span class="color-tag" style="--tag-color:${esc(color.hex)}"><i></i>${esc(color.name)}</span>`;}
function mins(ts){return Math.max(0,Math.round((Date.now()-ts)/60000));}
function cardAgo(ts){const e=Math.max(0,Date.now()-Number(ts||Date.now()));return e<60000?'just now':ago(ts);}
function ago(ts){const elapsed=Math.max(0,Date.now()-Number(ts||Date.now()));if(elapsed<60000)return Math.round(elapsed/1000)+'s ago';if(elapsed<=3600000)return Math.round(elapsed/60000)+'m ago';if(elapsed<=48*3600000)return Math.round(elapsed/3600000)+'h ago';if(elapsed<=14*86400000)return Math.round(elapsed/86400000)+'d ago';return Math.round(elapsed/(7*86400000))+'w ago';}
function fmtTok(n){n=Number(n);if(!Number.isFinite(n))return '0';if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(0)+'k';return String(n||0);}
const WARN=.5,AMBER=.35;
function ctxClass(pct){return pct>=WARN?'red':pct>=AMBER?'amber':'';}
function ctxHtml(c){if(!c)return '';if(!Number.isFinite(c.pct))return `<div class="ctx"><div class="clab"><span>Context used</span><span>n/a${Number.isFinite(c.limit)?` · ${esc(fmtTok(c.limit))} limit`:''}</span></div></div>`;const cls=ctxClass(c.pct),pct=Math.round(c.pct*100);return `<div class="ctx ${cls}"><div class="clab"><span>Context used</span><span>${pct}% · ${esc(fmtTok(c.tokens))}/${esc(fmtTok(c.limit))}</span></div><div class="bar"><i style="width:${Math.min(100,pct)}%"></i></div></div>`;}
function providerKey(x){const p=(x&&x.provider)||'claude';return p==='agy'?'antigravity':p;}
function api(path){return '/api/chats/'+encodeURIComponent(NAME)+path;}

function scrollLatestMessage(){const el=document.getElementById('messages');el.scrollTop=el.scrollHeight;}
function autoGrow(){const el=document.getElementById('input');el.style.height='auto';el.style.height=Math.min(el.scrollHeight,132)+'px';}
function syncVisualViewport(){
  const viewport=window.visualViewport;if(!viewport)return;
  document.documentElement.style.setProperty('--visual-viewport-height',Math.round(viewport.height)+'px');
  if(document.activeElement===document.getElementById('input'))requestAnimationFrame(scrollLatestMessage);
}
if(window.visualViewport){syncVisualViewport();window.visualViewport.addEventListener('resize',syncVisualViewport);}

const TOOL_VERB = { Bash:'Running a command', Read:'Reading a file', Write:'Editing a file', Edit:'Editing a file',
  Grep:'Searching the code', Glob:'Searching the code', WebFetch:'Reading a web page', WebSearch:'Searching the web',
  Task:'Working with a helper', Agent:'Working with a helper', Skill:'Using a skill', TodoWrite:'Planning',
  TaskCreate:'Planning', TaskUpdate:'Planning', AskUserQuestion:'Asking a question', Workflow:'Coordinating helpers' };
function toolVerb(name){ if(TOOL_VERB[name]) return TOOL_VERB[name]; if(/^mcp__/.test(name)) return 'Using an app'; return name; }
function stateInfo(state, dead){if(dead||state==='ended')return['ended','Ended'];if(state==='running')return['running','Working…'];if(state==='needs_you')return['needs_you','Needs you'];return['idle','Idle'];}
function pill(state, dead){const p=stateInfo(state,dead);return `<span class="pill ${esc(p[0])}"><span class="dot"></span>${esc(p[1])}</span>`;}

async function tick(){
  if(!TOKEN) return;
  try{
    const [sessions, chats] = await Promise.all([
      fetch('/api/sessions').then(r=>r.json()),
      fetch('/api/chats?closed=1',{headers:H()}).then(r=>r.json()),
    ]);
    failCount=0; setOffline(false);
    // Release answered latches as soon as a chat's prompt is observed GONE: consecutive permission
    // prompts share title+option keys, so a time-only latch would lock out the NEXT approval (panel
    // BLOCKER). The stale-poll window the latch guards ends when the server stops reporting pending.
    for(const c of (chats||[])){const sMatch=matchedSession(sessions,c.name);if(!(sMatch.pending&&sMatch.pending.kind!=='none')){const prefix=c.name+'\u0000';for(const k of Array.from(answeredPending.keys()))if(k.startsWith(prefix))answeredPending.delete(k);}}
    renderSidebar(chats,sessions);
    if(!NAME){ renderPicker(chats, sessions); return; }
    const chat = chats.find(c=>c.name===NAME);
    // A well-formed but unknown/stale ck-name (no such chat) is NOT sendable — treat it as ended so the
    // composer disables instead of POSTing into the void and leaving an optimistic bubble stuck forever.
    const dead = !chat || chat.alive===false;
    // exact-identity match, prefer a live/newest session (same rule as live.html:202)
    const named = sessions.filter(s=>s.chatName===NAME)
      .sort((a,b)=>((a.state==='ended')-(b.state==='ended'))||((b.lastActivityAt||0)-(a.lastActivityAt||0)));
    const s = named[0]||{};
    window.chatMediated=!!(chat&&chat.mediated);
    const openTP=(chat&&!chat.closed&&chat.transcriptPath)||null;
    activeTranscript=window.chatMediated?'':(s.transcriptPath||openTP||'');
    renderHeader(chat, s, dead);
    let turns=[];
    const closedTP=(chat&&chat.closed&&chat.transcriptPath)||null;
    if((chat&&chat.mediated)||s.transcriptPath||openTP||closedTP){
      const messagePath=chat&&chat.mediated?'/messages':`/messages?path=${encodeURIComponent(s.transcriptPath||openTP||closedTP)}`;
      turns = await fetch(api(messagePath),{headers:H()}).then(r=>r.json());
      if(chat&&chat.mediated&&turns.length){
        const last=turns[turns.length-1];
        if(last.role==='claude'||last.role==='assistant')mediatedAwaiting=false;
        else if(last.role==='you')mediatedAwaiting=true;
      }
    }
    renderConversation(turns, s);
    await maybeRefreshFiles();
  }catch(e){ failCount++; if(failCount>=3) setOffline(true); }
}
setInterval(tick, 1500);

function setOffline(on){document.getElementById('offline').classList.toggle('on',on);}
function matchedSession(sessions,name){return sessions.filter(s=>s.chatName===name).sort((a,b)=>((a.state==='ended')-(b.state==='ended'))||((b.lastActivityAt||0)-(a.lastActivityAt||0)))[0]||{};}
function pendingCardHTML(name,pending){
  if(!pending||pending.kind==='none')return '';
  const pkey=pendingKey(name,pending),answered=isAnswered(name,pending),encodedKey=encodeURIComponent(pkey),options=Array.isArray(pending.options)?pending.options:[];
  return `<div class="approve"><div class="q question">${esc(pending.title||'Claude needs your answer')}</div><div class="options">${options.map((o,i)=>`<button class="option-row ${i===0?'recommended':''}" type="button" data-action="answer-card" data-chat="${esc(name)}" data-key="${esc(o.key)}" data-pkey="${esc(encodedKey)}" ${answered?'disabled':''}><span class="option-label">${esc(o.label)}</span>${i===0?'<span class="option-note">Recommended</span>':''}</button>`).join('')}</div>${answered?'<div class="answer-status">Answer sent — waiting for the session to move on…</div>':''}</div>`;
}
function chatCardHTML(c,s,compact){
  const color=cardColor(c.name),active=c.name===NAME;
  return `<article class="chat-card${compact?' compact':''}${active?' active':''}" style="--card-accent:${esc(color.hex)}" ${compact?`data-open="${esc(c.name)}"`:''}><div class="chat-copy"><div class="chat-top"><div class="chat-name">${esc(c.title||c.name)}</div>${pill(s.state,c.alive===false)}${colorTag(color)}<span class="badge provider">${esc(providerKey(s&&s.provider?s:c))}</span>${c.profile==='nondev'?'<span class="badge">Safe</span>':''}</div>${s.state==='needs_you'&&s.needsYou&&s.needsYou.message?`<div class="needs-msg">${esc(s.needsYou.message)}</div>`:''}${pendingCardHTML(c.name,s.pending)}${ctxHtml(s.context)}<div class="activity">Last activity · ${s.lastActivityAt?esc(cardAgo(s.lastActivityAt)):'—'}</div></div><button class="open" type="button" data-open="${esc(c.name)}">Open</button></article>`;
}
function chatCardsHTML(chats,sessions,compact){return (chats||[]).filter(c=>!c.closed).map(c=>chatCardHTML(c,matchedSession(sessions,c.name),compact)).join('');}
function closedCardHTML(c){return `<article class="chat-card compact closed" data-open="${esc(c.name)}"><div class="chat-copy"><div class="chat-top"><div class="chat-name">${esc(c.title||c.name)}</div><span class="badge">Closed</span></div><div class="activity">${c.closed?esc(new Date(c.closed).toLocaleDateString()):''}</div></div></article>`;}
function closedSectionHTML(chats){const closed=(chats||[]).filter(c=>c.closed);if(!closed.length)return '';return `<details class="closed-section"><summary>Closed chats · ${closed.length}</summary>${closed.map(closedCardHTML).join('')}</details>`;}
function renderSidebar(chats,sessions){const el=document.getElementById('sidebarList');if(!el)return;
  // innerHTML replacement destroys buttons mid-tap and wipes keyboard focus — only rebuild when the

// One delegated handler covers stable workspace controls plus cards that are replaced every poll.
document.querySelector('.workspace').addEventListener('click',e=>{if(e.target.closest('[data-new]')){openNewChat();return;}if(e.target.closest('[data-nc-cancel]')){closeNewChat();return;}if(e.target.closest('[data-nc-start]')){startNewChat();return;}const answerButton=e.target.closest('[data-action="answer-card"]');if(answerButton){if(!answerButton.disabled)answerCard(answerButton);return;}const op=e.target.closest('[data-open]');if(op){openChat(op.getAttribute('data-open'));return;}if(e.target.closest('[data-files-toggle]')){filesOpen()?closeFiles():openFiles();return;}if(e.target.closest('[data-files-close]')){closeFiles();return;}if(e.target.closest('[data-preview-back]')){closePreview();return;}if(e.target.closest('[data-download]'))downloadPreview();});
document.getElementById('filesList').addEventListener('click',e=>{const row=e.target.closest('[data-file-index]');if(row&&!row.disabled)previewFileAt(Number(row.getAttribute('data-file-index')));});
</script>
</body>
</html>
